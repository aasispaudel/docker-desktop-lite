name: docklite-demo

services:
  web:
    image: nginx:alpine
    ports:
      - "8088:80"
    labels:
      com.docklite.demo.role: frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: traefik/whoami:v1.10
    ports:
      - "8089:80"
    labels:
      com.docklite.demo.role: api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docklite
      POSTGRES_USER: docklite
      POSTGRES_PASSWORD: docklite
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docklite -d docklite"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: docklite
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: docklite
      MINIO_ROOT_PASSWORD: docklite-demo
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  worker:
    image: alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "processed demo background task"
          sleep 5
        done
    labels:
      com.docklite.demo.role: worker

  seed:
    image: busybox:1.36
    command:
      - /bin/sh
      - -c
      - |
        echo "Preparing demo data"
        echo "This container exits on purpose so Docklite can show a stopped container"
        sleep 2
        echo "Done"
    restart: "no"
    labels:
      com.docklite.demo.role: one-shot-job

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  minio_data:
